/* Ohne Wiederholungsbezirk (REVIEW leer) entfallen die Pools „Revision“ und „Alles“ */
const APOOLS = [["mine",T.poolMine,T.poolMineSub],["MAIN",UNIT.mainLabel,UNIT.title],["REV",UNIT.reviewLabel,T.poolRevSub],["ALL",T.poolAll,UNIT.mainLabel+" + "+UNIT.reviewLabel]].filter(p=>REVIEW.length>0||(p[0]!=="REV"&&p[0]!=="ALL"));
function minePool(){ const s=new Set(); MISSIONS.forEach(m=>{ if((G.stars[m.id]||0)>=1) m.words.forEach(w=>s.add(w)); }); return [...s]; }
function arcadePool(){
  if(S.apool==="mine"){ const p=minePool(); return p.length>=8 ? p : MAIN.slice(); }
  if(S.apool==="REV") return REVIEW.slice(); if(S.apool==="ALL") return ALL.slice(); return MAIN.slice();
}
function poolLabel(){ const p=APOOLS.find(x=>x[0]===S.apool); return p[1]+(S.apool==="mine"&&minePool().length<8?" ("+T.notEnoughYet+")":""); }
function arcadeOpen(id){
  const g=ARCADE.find(x=>x.id===id);
  if(!S.preview && rankIdx(G.voices)<g.rank) return;
  openAct(g.icon+" "+g.name, id==="daily"?UNIT.mainLabel+" + "+UNIT.reviewLabel:poolLabel(), ()=>goTab("arcade"));
  ({quick:gameQuick, spell:gameSpell, memory:gameMemory, daily:gameDaily, sort:gameSort, rain:gameRain, survive:gameSurvive})[id]();
}
function best(id, v, low){ const b=S.best[id]; if(b==null || (low? v<b : v>b)){ S.best[id]=v; persist(); return true; } return false; }
function endScreen(title, sub, missed, again, extra){
  V.innerHTML='<div class="result"><div class="score">'+title+'</div><p>'+sub+'</p></div>'+(extra||"")+
    (missed&&missed.length?'<p class="sec">'+T.practiseAgain+'</p><div class="review">'+uniqBy(missed,w=>w.zs).map(w=>'<div class="rv"><i class="x"></i><span><b>'+esc(dispOf(w))+'</b> – '+esc(w.de)+'</span></div>').join("")+'</div>':'')+
    '<div class="row"><button class="btn wide" id="again" type="button">'+T.playAgain+'</button><button class="btn ghost wide" id="toArc" type="button">'+T.tabs.arcade.replace(/^\S+\s/,"")+'</button></div>'+codeMini();
  $("again").onclick=again; $("toArc").onclick=()=>{ cleanup(); goTab("arcade"); }; focusSoon("again");
}
function AG(id){ return ARCADE.find(x=>x.id===id); }

/* --- Compte à rebours / Quick-fire --- */
function gameQuick(){
  const pool=arcadePool(); let t=60, score=0, combo=0, right=0, missed=[], recent=[], cur=null, lock=false, started=false;
  V.innerHTML='<p class="why">'+T.quickWhy+'</p>'+
    '<div class="ahud"><span>⏱ <span class="big" id="qfT">60</span></span><span>'+T.score+' <span class="big" id="qfS">0</span></span><span class="combo" id="qfC" hidden></span><span style="color:var(--muted)">'+T.bestToday+' '+(S.best.quick||0)+'</span></div>'+
    '<div class="tbar"><i id="qfBar"></i></div><div class="prompt" id="qfP"></div>'+
    '<form class="row" id="qfF" autocomplete="off"><input type="text" id="qfIn" aria-label="'+T.phFR+'" autocapitalize="none" spellcheck="false" placeholder="'+T.quickPh+'"><button class="btn ghost" type="button" id="qfSkip">'+T.skip+'</button><button class="btn" type="submit">'+T.enter+'</button></form><div id="qfFb"></div>';
  function next(){ let w; do{ w=pick(pool); }while(pool.length>6 && recent.indexOf(w)>=0); recent.push(w); if(recent.length>5) recent.shift(); cur=w;
    $("qfP").innerHTML='<span class="pl">'+T.de2fr+'</span>'+deWord(w); $("qfIn").value=""; $("qfIn").className=""; }
  function hud(){ $("qfS").textContent=score; const m=1+Math.floor(combo/5); const c=$("qfC"); c.hidden=combo<2; c.textContent="combo "+combo+(m>1?" · ×"+m:""); }
  const iv=setInterval(()=>{ if(!started) return; t-=.1; $("qfT").textContent=Math.max(0,Math.ceil(t)); $("qfBar").style.width=Math.max(0,t/60*100)+"%"; if(t<=5 && Math.abs(t-Math.round(t))<.05) SFX.tick(); if(t<=0) end(); },100);
  CLEANUP=()=>clearInterval(iv);
  $("qfIn").addEventListener("input",()=>{ started=true; });
  $("qfF").onsubmit=e=>{ e.preventDefault(); if(lock||t<=0) return; const v=$("qfIn").value; if(!v.trim()) return; started=true;
    const r=checkZS(v,cur);
    if(r.r==="ok"){ combo++; const m=1+Math.floor(combo/5); score+=m; right++; SFX.ok(); typedRun(true); rec(cur.zs,true); award(3); $("qfFb").innerHTML=""; hud(); next(); }
    else if(r.r==="mid"){ SFX.mid(); $("qfIn").className="mid-mark"; $("qfFb").innerHTML=fb("mid",r.msg||T.almost); }
    else { combo=0; SFX.ko(); typedRun(false); rec(cur.zs,false); missed.push(cur); lock=true; $("qfIn").className="ko-mark"; $("qfFb").innerHTML=fb("ko","« "+esc(dispOf(cur))+" »"); hud();
      setTimeout(()=>{ lock=false; $("qfFb").innerHTML=""; next(); $("qfIn").focus(); },1100); }
  };
  $("qfSkip").onclick=()=>{ if(t<=0) return; started=true; combo=0; missed.push(cur); hud(); $("qfFb").innerHTML=fb("mid",T.skipped+" « "+esc(dispOf(cur))+" »"); next(); $("qfIn").focus(); };
  function end(){ clearInterval(iv); CLEANUP=null; t=0; const nb=best("quick",score); if(score>=15) earnBadge(5); storeTier("watch",score);
    endScreen(score+" "+T.points, right+" "+T.wordsRight+(nb&&score?" · "+T.newBest:"")+".", missed, gameQuick); }
  next(); hud(); focusSoon("qfIn");
}

/* --- Pluie / fallende Elemente --- */
function gameRain(){
  const pool=arcadePool(), g=AG("rain");
  let lives=3, level=1, cleared=0, drops=[], last=0, spawnAt=0, raf=0, over=false, paused=false, missed=[];
  V.innerHTML='<p class="why">'+g.why+'</p>'+
    '<div class="ahud"><span class="hearts" id="wrL"></span><span>'+T.levelW+' <span class="big" id="wrLv">1</span></span><span>'+g.counter+' <span class="big" id="wrC">0</span></span><span style="color:var(--muted)">'+T.bestToday+' '+(S.best.rain||0)+'</span></div>'+
    '<form class="row" id="wrF" autocomplete="off"><input type="text" id="wrIn" aria-label="'+T.phFR+'" autocapitalize="none" spellcheck="false" placeholder="'+T.typeHere+'"><button class="btn ghost" type="button" id="wrP">'+T.pause+'</button></form><div class="ticker" id="wrT" aria-live="polite"></div>'+
    '<div class="rain" id="wrBox"><div class="ground"></div></div>';
  const box=$("wrBox");
  function hud(){ $("wrL").textContent="❤️".repeat(lives)+"🤍".repeat(3-lives); $("wrLv").textContent=level; $("wrC").textContent=cleared; }
  const speed=()=>(reduced?18:26)*(1+.16*(level-1));
  const gapMs=()=>Math.max(1100, 3000*Math.pow(.88,level-1));
  function spawn(){
    const onScreen=new Set(drops.map(d=>d.w));
    const cand=pool.filter(w=>!onScreen.has(w) && !drops.some(d=>sameFamily(d.w,w)));
    if(!cand.length) return; const w=pick(cand);
    const el=document.createElement("div"); el.className="drop "+g.dropCls; el.lang="de"; el.innerHTML='<span class="from" aria-hidden="true">'+g.dropLabel+'</span>'+esc(shortDE(w)); box.appendChild(el);
    const maxX=Math.max(4, box.clientWidth-el.offsetWidth-6);
    drops.push({w:w, el:el, x:4+Math.random()*maxX, y:-el.offsetHeight});
  }
  function loop(ts){
    if(over) return;
    if(!last) last=ts; const dt=Math.min(.05,(ts-last)/1000); last=ts;
    if(!paused){
      if(ts>=spawnAt){ spawn(); spawnAt=ts+gapMs(); }
      const H=box.clientHeight-6;
      drops.slice().forEach(d=>{ d.y+=speed()*dt; d.el.style.transform="translate("+d.x+"px,"+d.y+"px)";
        if(d.y+d.el.offsetHeight>=H){ drops.splice(drops.indexOf(d),1); d.el.remove(); lives--; missed.push(d.w); rec(d.w.zs,false); SFX.ko();
          $("wrT").innerHTML=g.lost+' <b lang="de">'+esc(shortDE(d.w))+'</b> = <b>'+esc(dispOf(d.w))+'</b>'; hud(); if(lives<=0) end(); } });
    }
    raf=requestAnimationFrame(loop);
  }
  function tryClear(v, enter){
    const d=drops.find(d=>checkZS(v,d.w).r==="ok");
    if(d){ drops.splice(drops.indexOf(d),1); d.el.classList.add("hit"); setTimeout(()=>d.el.remove(),350); cleared++; SFX.ok(); rec(d.w.zs,true); award(3);
      $("wrT").innerHTML='✓ <b>'+esc(dispOf(d.w))+'</b> – '+esc(d.w.de); $("wrIn").value="";
      if(cleared%6===0){ level++; toast(g.icon,T.levelW+" "+level,g.levelUp); if(level>=5) earnBadge(6); }
      hud(); return; }
    if(enter){ const nd=drops.find(d=>checkZS(v,d.w).r==="mid"); $("wrT").innerHTML = nd ? (checkZS(v,nd.w).msg||T.almost) : T.noMatch(esc(v)); if(nd) SFX.mid(); }
  }
  $("wrIn").addEventListener("input",e=>{ const v=e.target.value; if(v.trim().length>=2) tryClear(v,false); });
  $("wrF").onsubmit=e=>{ e.preventDefault(); const v=$("wrIn").value; if(v.trim()) tryClear(v,true); };
  $("wrP").onclick=()=>{ paused=!paused; $("wrP").textContent=paused?T.goOn:T.pause; if(!paused){ last=0; $("wrIn").focus(); } };
  const vis=()=>{ if(document.hidden){ paused=true; $("wrP").textContent=T.goOn; } };
  document.addEventListener("visibilitychange",vis);
  CLEANUP=()=>{ over=true; cancelAnimationFrame(raf); document.removeEventListener("visibilitychange",vis); };
  function end(){ over=true; cancelAnimationFrame(raf); document.removeEventListener("visibilitychange",vis); CLEANUP=null;
    const nb=best("rain",cleared); endScreen(cleared+" "+T.wordsW, T.levelW+" "+level+(nb&&cleared?" · "+T.newBest:"")+".", missed, gameRain); }
  hud(); raf=requestAnimationFrame(loop); focusSoon("wrIn");
}

/* --- Buchstaben-Bauen --- */
const FRL=new RegExp("["+LANG.letters+"]");   /* Buchstaben der Zielsprache (Spiel Assemblage) */
function gameSpell(){
  const target=w=>headword(w).toLowerCase();
  const pool=arcadePool().filter(w=>{ const t=target(w); return t.length>=3 && t.length<=16 && new RegExp("^["+LANG.letters+"' -]+$").test(t); });
  const words=shuffle(pool).slice(0,10); let i=0, right=0, noHint=0, missed=[];
  function render(){
    const w=words[i]; if(!w) return end();
    const t=target(w); const chars=t.split(""); const fixed=chars.map(c=>FRL.test(c)?null:c);
    const letters=shuffle(chars.filter(c=>FRL.test(c)).map((c,k)=>({c:c,k:k})));
    const placed=[]; let hinted=false, closed=false;
    V.innerHTML=progress(i,words.length,T.word+" "+(i+1)+" / "+words.length,right+" "+T.built)+
      '<div class="prompt"><span class="pl">'+T.buildFR+'</span>'+deWord(w)+pills(w)+'</div>'+
      '<div class="slots" id="sbS" aria-live="polite"></div><div class="tilesL" id="sbT"></div>'+
      '<div class="row"><button class="btn ghost" type="button" id="sbB">⌫ '+T.back+'</button><button class="btn ghost" type="button" id="sbH">'+T.hint+'</button><button class="btn ghost" type="button" id="sbX">'+T.skip+'</button></div><div id="sbFb"></div><div id="sbA"></div>'+
      '<p class="why">'+T.keyboardTip+'</p>';
    function slots(){ let p=0; $("sbS").innerHTML=chars.map((c,k)=>{ if(fixed[k]!==null) return '<span class="slot sp">'+(c===" "?"":esc(c))+'</span>';
      const pl=placed[p++]; const cur=!pl && p-1===placed.length; return '<span class="slot'+(cur?" cur":"")+(pl&&pl.h?" hint":"")+'">'+(pl?esc(pl.c):"")+'</span>'; }).join(""); }
    function tiles(){ $("sbT").innerHTML=letters.map((l,k)=>'<button type="button" class="lt" data-k="'+k+'"'+(placed.some(p=>p.k===k)?" disabled":"")+'>'+esc(l.c)+'</button>').join(""); }
    const need=letters.length;
    function built(){ let p=0; return chars.map((c,k)=>fixed[k]!==null?c:(placed[p++]||{c:""}).c).join(""); }
    function place(k,h){ if(closed||placed.length>=need) return; placed.push({c:letters[k].c,k:k,h:!!h}); slots(); tiles(); if(placed.length===need) check(); }
    function check(){
      if(built()===t){ closed=true; right++; if(!hinted) noHint++; SFX.ok(); rec(w.zs,!hinted); award(hinted?2:4); $("sbFb").innerHTML=fb("ok",T.rightBang); $("sbA").innerHTML=answerBox(w); say(speakable(dispOf(w)));
        setTimeout(()=>{ i++; render(); }, 1300); }
      else { SFX.ko(); $("sbS").classList.add("shake"); setTimeout(()=>$("sbS").classList.remove("shake"),330); $("sbFb").innerHTML=fb("ko",T.spellWrong); }
    }
    $("sbT").onclick=e=>{ const b=e.target.closest(".lt"); if(b&&!b.disabled) place(+b.getAttribute("data-k")); };
    $("sbB").onclick=()=>{ if(closed) return; placed.pop(); slots(); tiles(); $("sbFb").innerHTML=""; };
    $("sbH").onclick=()=>{ if(closed) return; hinted=true;
      const want=t.split("").filter(c=>FRL.test(c));
      let n=0; while(n<placed.length && placed[n].c===want[n]) n++;
      placed.length=n; const k=letters.findIndex((l,kk)=>l.c===want[n] && !placed.some(p=>p.k===kk));
      $("sbFb").innerHTML=""; if(k>=0) place(k,true); else { slots(); tiles(); } };
    $("sbX").onclick=()=>{ if(closed) return; closed=true; missed.push(w); rec(w.zs,false); SFX.ko(); $("sbFb").innerHTML=fb("ko",T.theWord+" « "+esc(t)+" »"); $("sbA").innerHTML=answerBox(w)+'<div class="row"><button class="btn wide" id="sbN" type="button">'+T.next+'</button></div>'; $("sbN").onclick=()=>{ i++; render(); }; focusSoon("sbN"); };
    const key=e=>{ if(closed||e.target.tagName==="INPUT") return; const c=e.key.toLowerCase();
      if(e.key==="Backspace"){ e.preventDefault(); $("sbB").click(); return; }
      if(c.length===1 && FRL.test(c)){ const k=letters.findIndex((l,kk)=>l.c===c && !placed.some(p=>p.k===kk)); if(k>=0) place(k); } };
    const prev=render._k; if(prev) document.removeEventListener("keydown",prev); render._k=key;
    document.addEventListener("keydown",key); CLEANUP=()=>document.removeEventListener("keydown",key);
    slots(); tiles();
  }
  function end(){ if(render._k) document.removeEventListener("keydown",render._k); CLEANUP=null; if(noHint>=10) earnBadge(8);
    best("spell",right); endScreen(right+" / "+words.length, noHint+" "+T.noHints, missed, gameSpell); }
  if(words.length<4){ V.innerHTML=emptyMsg(T.notEnough); return; }
  render();
}

/* --- Memory --- */
function gameMemory(){
  const pool=shuffle(arcadePool()); const pairs=[];
  pool.forEach(w=>{ if(pairs.length<6 && !pairs.some(p=>sameFamily(p,w)) && shortDE(w).length<=30 && dispOf(w).length<=30) pairs.push(w); });
  const cards=shuffle(pairs.flatMap(w=>[{w:w,s:"en",t:dispOf(w)},{w:w,s:"de",t:shortDE(w)}]));
  let open=[], moves=0, found=0, busy=false;
  V.innerHTML='<p class="why">'+T.memWhy+'</p><div class="ahud"><span>'+T.moves+' <span class="big" id="mmM">0</span></span><span>'+T.pairs+' <span class="big" id="mmP">0</span> / 6</span><span style="color:var(--muted)">'+T.bestToday+' '+(S.best.memory!=null?S.best.memory+" "+T.moves.toLowerCase():"–")+'</span></div><div class="memgrid" id="mmG"></div>';
  $("mmG").innerHTML=cards.map((c,k)=>'<button type="button" class="mem" data-k="'+k+'" aria-label="'+T.hiddenCard+'"><span class="back-face" aria-hidden="true">?</span></button>').join("");
  $("mmG").onclick=e=>{ const b=e.target.closest(".mem"); if(!b||busy||b.classList.contains("up")) return; const k=+b.getAttribute("data-k"), c=cards[k];
    b.classList.add("up",c.s); b.innerHTML=esc(c.t); if(c.s==="de") b.lang="de"; b.setAttribute("aria-label",c.t); open.push({b:b,c:c});
    if(open.length===2){ moves++; $("mmM").textContent=moves; const [a,d]=open; open=[];
      if(a.c.w===d.c.w && a.c.s!==d.c.s){ found++; $("mmP").textContent=found; SFX.ok(); award(2); [a,d].forEach(x=>{ x.b.classList.add("ok-mark"); x.b.disabled=true; });
        if(found===6){ const nb=best("memory",moves,true); setTimeout(()=>endScreen(moves+" "+T.moves.toLowerCase(),T.memEnd+(nb?" · "+T.newBest:""),[],gameMemory),700); } }
      else { busy=true; SFX.ko(); setTimeout(()=>{ [a,d].forEach(x=>{ x.b.classList.remove("up","en","de"); x.b.innerHTML='<span class="back-face" aria-hidden="true">?</span>'; x.b.setAttribute("aria-label",T.hiddenCard); }); busy=false; },1000); } } };
}

/* --- Wortarten im Satz --- */
const POSBIN=[["n",T.posN],["v",T.posV],["adj",T.posAdj],["adv",T.posAdv],["other",T.posOther]];
function gameSort(){
  const pool=arcadePool().filter(w=>clozeOK(w) && w.pos && w.pos!=="other" && w.bl.indexOf(" ")<0 && !/'$/.test(w.bl));
  const items=shuffle(pool).slice(0,15); let i=0, right=0, missed=[];
  function render(){
    const w=items[i]; if(!w) return end();
    const k=w.bi!=null?w.bi:w.ex.indexOf(w.bl);
    V.innerHTML=progress(i,items.length,T.word+" "+(i+1)+" / "+items.length,right+" "+T.right)+
      '<div class="prompt"><span class="pl">'+T.sortPrompt+'</span><div class="sent">'+esc(w.ex.slice(0,k))+'<span class="gap">'+esc(w.bl)+'</span>'+esc(w.ex.slice(k+w.bl.length))+'</div></div>'+
      '<div class="bins">'+POSBIN.slice(0,4).map(p=>'<button type="button" class="opt" data-p="'+p[0]+'">'+p[1]+'</button>').join("")+'</div><div id="soFb"></div><div class="row" id="soN" hidden><button class="btn wide" id="soNext" type="button">'+T.next+'</button></div>';
    let closed=false;
    V.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ if(closed) return; closed=true; const ok=b.getAttribute("data-p")===w.pos;
      V.querySelectorAll("[data-p]").forEach(x=>{ x.disabled=true; if(x.getAttribute("data-p")===w.pos) x.classList.add("ok-mark"); });
      if(ok){ right++; SFX.ok(); award(2); } else { b.classList.add("ko-mark"); missed.push(w); SFX.ko(); }
      $("soFb").innerHTML=fb(ok?"ok":"ko", ok?T.rightBang:T.notQuiteShort, esc(dispOf(w))+' – '+esc(w.de));
      $("soN").hidden=false; focusSoon("soNext"); });
    $("soNext").onclick=()=>{ i++; render(); };
  }
  function end(){ if(right>=14) earnBadge(9); best("sort",right); endScreen(right+" / "+items.length, T.sortEnd, missed, gameSort); }
  if(items.length<6){ V.innerHTML=emptyMsg(T.notEnough); return; }
  render();
}

/* --- gemischte Aufgaben (Survie, Briefing) --- */
function mixedItem(pool, rnd){
  rnd=rnd||Math.random;
  const w=pick(pool,rnd), x=rnd();
  const opp=OPP.find(o=>o.w===w.zs), same=SAME.find(s=>s[0]===w.zs), par=PARTNERS.filter(p=>p.w===w.zs), eng=ENG.find(e=>e[0]===w.zs);
  if(x<.36) return itTypeFR(w,4);
  if(x<.50) return itMCDE(w,pool,2);
  if(x<.65 && clozeOK(w)) return itGap(w,5);
  if(x<.73 && opp) return itOpp(opp,false);
  if(x<.84 && same) return itExplain(same);
  if(x<.92 && par.length) return itPartner(pick(par,rnd),false);
  if(x<.97 && eng) return itEng(eng,false);
  return itTypeFR(w,4);
}
function gameSurvive(){
  const pool=arcadePool();
  quiz({gen:()=>mixedItem(pool), lives:3, best:()=>S.best.survive||0, top:()=>'<p class="why">'+T.surviveWhy+'</p>'}, st=>{
    if(st.score>=20) earnBadge(7); storeTier("mug",st.score); const nb=best("survive",st.score);
    endScreen(st.score+" "+T.right, AG("survive").name+(nb&&st.score?" · "+T.newBest:"")+".", st.wrong.map(i=>i.w).filter(Boolean), gameSurvive);
  });
}
function gameDaily(){
  const d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(), rnd=mulberry(fnv("daily|"+UNIT.key+"|"+key));
  const items=[]; const used=new Set(); let guard=0;
  while(items.length<10 && guard++<200){ const it=mixedItem(ALL,rnd); if(it.w && used.has(it.w.zs)) continue; if(it.w) used.add(it.w.zs); items.push(it); }
  quiz({items:items, label:T.task, top:()=>'<p class="why">'+T.dailyWhy(esc(d.toLocaleDateString(LANG.locale,{weekday:"long",day:"numeric",month:"long"})))+'</p>'}, st=>{
    const today=dayIdx(); let extra="";
    if(S.daily!==today){ S.daily=today; persist(); earnBadge(10); if(st.score>=7){ award(40); extra='<p class="why" style="text-align:center">'+T.dailyBonus+'</p>'; } }
    endScreen(st.score+" / 10", T.dailyEnd, st.wrong.map(i=>i.w).filter(Boolean), gameDaily, extra);
  });
}

/* ===================== ENTRAÎNEMENT (alle Word-Lab-Formate, freie Wahl des Wortsets) ===================== */
const MAINDIST = DISTRICT_DEF.filter(d=>d.src==="MAIN");
const TSETS = MAINDIST.map(d=>({id:d.id,name:d.name,sub:d.sub}))
  .concat([{id:"MAIN", name:T.allOf(UNIT.mainLabel), sub:UNIT.title},
           {id:"REV", name:UNIT.reviewLabel, sub:T.poolRevSub},
           {id:"TRICKY",name:T.tricky,sub:T.today}]).filter(s=>REVIEW.length>0||s.id!=="REV");
function tWords(){
  if(S.set==="TRICKY") return trickyList().map(k=>BY[k]);
  if(S.set==="REV") return REVIEW.slice();
  if(S.set==="MAIN") return MAIN.slice();
  return MAIN.filter(w=>w.sec===S.set);
}
let TW=new Set();
function tRefresh(){ TW=new Set(tWords()); }
function tIn(fr){ const w=BY[fr]; return !!w && TW.has(w); }
function tLabel(){ return TSETS.find(x=>x.id===S.set).name; }
function tCloze(){ return tWords().filter(clozeOK); }

function makeBoards(words, size){
  const rest=shuffle(words), boards=[];
  while(rest.length){ const b=[];
    for(let i=0;i<rest.length && b.length<size;){ const w=rest[i]; if(b.some(x=>sameFamily(x,w))){ i++; continue; } b.push(w); rest.splice(i,1); }
    if(!b.length) b.push(rest.shift()); boards.push(b); }
  return boards;
}

const TR={partners:"choose", web:"same", webMode:"choose"};
const WEBPARTS=["same","explain","opp","fam"].concat(ENG.length?["eng"]:[]);
function trainRound(kind){
  let items=[], top=()=>"", bind=null;
  if(kind==="pics"){ items=shuffle(PICS.filter(p=>tIn(p[1]))).slice(0,10).map(itPic);
    top=()=>'<p class="why">'+T.picWhy+'</p>'; }
  if(kind==="partners"){ const typed=TR.partners==="type"; items=shuffle(PARTNERS.filter(p=>tIn(p.w))).slice(0,8).map(p=>itPartner(p,typed));
    top=()=>seg("pMode",[["choose",T.choose],["type",T.typeW]],TR.partners)+'<p class="why">'+T.partnerWhy+'</p>';
    bind=()=>onSeg("pMode",v=>{ TR.partners=v; trainRound("partners"); }); }
  if(kind==="web"){ const s=TR.web, typed=s!=="explain" && TR.webMode==="type";
    if(s==="same") items=shuffle(SAME.filter(x=>tIn(x[0]))).slice(0,8).map(x=>itSame(x,typed));
    if(s==="explain") items=shuffle(SAME.filter(x=>tIn(x[0]))).slice(0,8).map(itExplain);
    if(s==="opp") items=shuffle(OPP.filter(o=>tIn(o.w))).slice(0,8).map(o=>itOpp(o,typed));
    if(s==="fam") items=shuffle(FAM.filter(f=>tIn(f.w))).slice(0,8).map(f=>itFam(f,typed));
    if(s==="eng") items=shuffle(ENG.filter(e=>tIn(e[0]))).slice(0,8).map(e=>itEng(e,typed));
    top=()=>seg("wSub",WEBPARTS.map(k=>[k,T.web[k]]),s)+(s==="explain"?"":seg("wMode",[["choose",T.choose],["type",T.typeW]],TR.webMode))+
      '<p class="why">'+T.webWhy[s]+'</p>';
    bind=()=>{ onSeg("wSub",v=>{ TR.web=v; trainRound("web"); }); onSeg("wMode",v=>{ TR.webMode=v; trainRound("web"); }); }; }
  if(!items.length){ V.innerHTML=top()+emptyMsg(T.notEnoughSet); if(bind) bind(); return; }
  quiz({items:items, top:top, bind:bind, hints:true, selfDE:true}, st=>{
    if(kind==="partners" && st.score===items.length && items.length>=8) earnBadge(3);
    if(kind==="web"){ if(TR.web==="explain" && st.score===items.length && items.length>=8) earnBadge(4);
      if(S.web.indexOf(TR.web)<0){ S.web.push(TR.web); persist(); } if(WEBPARTS.every(x=>S.web.indexOf(x)>=0)) earnBadge(2); }
    V.innerHTML=top()+'<div class="result"><div class="score">'+st.score+' / '+items.length+'</div><p>'+(st.score===items.length?T.allRight:T.lookMissed)+'</p></div>'+reviewList(st.wrong)+
      '<div class="row"><button class="btn wide" id="again" type="button">'+T.newRound+'</button></div>';
    if(bind) bind(); $("again").onclick=()=>trainRound(kind);
  });
}

function unitUsed(text){
  const t=" "+norm(text)+" ", hit=[];
  MAIN.forEach(w=>{
    const forms=new Set();
    cores(w).concat([w.bl||""]).forEach(f=>{ f=norm(f).replace(ARTRE,""); if(f.length>=3) forms.add(f); });
    if(w.pos==="v"){ const inf=norm(headword(w)).replace(LANG.headStrip||/^\b$/,"").split(" ")[0]; const st=inf.replace(LANG.verbEnd,""); if(st.length>=4) forms.add(st); }
    const list=[...forms].map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
    if(!list.length) return;
    const re=new RegExp("(^|[^a-zà-ÿœ])("+list.join("|")+")[a-zà-ÿ]{0,4}(?=[^a-zà-ÿœ]|$)");
    if(re.test(t)){ const hw=headword(w); if(hit.indexOf(hw)<0) hit.push(hw); } });
  return hit;
}

  const fn={1:stageMeet,2:stageRecall,3:stageMaster,4:stageExpert}[k];
  fn(m, r=>{
    let bonus=0; if(r.pass) bonus=setStars(m,k);
    const nextM=m.d.missions[m.d.missions.indexOf(m)+1];

      (r.pass ? (k===2?T.allLearnt(r.turns):T.partDone)+' '+(bonus?'+'+bonus+' '+T.xpBonus:(S.preview?T.previewNoXP:T.alreadyHad)) : T.needPct(k===4?90:80)+' '+T.failLine)+'</p></div>'+
      trickyChips(r.wrong||[])+
      '<div class="row">'+(r.pass&&k<4?'<button class="btn wide" id="rNext" type="button">'+T.nextColon+' '+names[k+1]+' →</button>':'')+(!r.pass?'<button class="btn wide" id="rAgain" type="button">'+T.tryAgain+'</button>':'')+
      (r.pass&&k>=3&&nextM?'<button class="btn '+(k<4?"ghost ":"")+'wide" id="rNM" type="button">'+T.nextProject+' : '+esc(nextM.label)+' →</button>':'')+
      (r.pass&&k>=3&&!nextM&&bossOpen(m.d)?'<button class="btn wide" id="rBoss" type="button">'+T.bossIcon+' '+esc(T.bossName)+' →</button>':'')+
      '<button class="btn ghost wide" id="rBack" type="button">'+T.overview+'</button></div>'+codeMini();
    const b=(id,f)=>{ const el=$(id); if(el) el.onclick=f; };
    b("rNext",()=>runStage(m,k+1)); b("rAgain",()=>runStage(m,k)); b("rNM",()=>openMission(nextM.id)); b("rBoss",()=>openBoss(m.d.id)); b("rBack",()=>openMission(m.id));
    focusSoon($("rNext")?"rNext":($("rNM")?"rNM":($("rAgain")?"rAgain":"rBack")));
  });
}
function openBoss(did){
  const d=DISTRICTS.find(x=>x.id===did); if(!bossOpen(d)) return;
  openAct(T.bossIcon+" "+T.bossName+" · "+d.name, T.bossFormat(TEST_MAX), ()=>{ S.dist=d.id; goTab("career"); });
  V.innerHTML='<div class="prompt" style="text-align:left"><span class="pl">'+esc(T.bossName)+'</span><div class="word" style="font-size:1.4rem">'+T.bossHead+'</div><p style="margin:.4em 0 0">'+T.bossIntro(testSummary())+'</p></div><div class="row"><button class="btn wide" id="bGo" type="button">'+T.bossStart+'</button></div>';
  $("bGo").onclick=()=>practiceTest(d.words, {nextLabel:T.seeResult, why:T.bossWhy(d.name)}, r=>{
    const pct=r.pts/r.max; const k=pct>=.95?3:(pct>=.8?2:(pct>=.6?1:0)); const bonus=k?setBoss(d,k):0;
    V.innerHTML='<div class="result"><div class="bigstars">'+starStr(k)+'</div><div class="score">'+String(r.pts).replace(".",",")+' / '+r.max+'</div><p>'+(k?(bonus?T.bossWon(bonus):T.bossAgainOk):T.bossFail)+'</p></div>'+trickyChips(r.miss)+
      '<div class="row"><button class="btn wide" id="bAgain" type="button">'+T.bossNew+'</button><button class="btn ghost wide" id="bBack" type="button">'+esc(T.tabs.career.replace(/^\S+\s/,""))+'</button></div>'+codeMini();
    $("bAgain").onclick=()=>openBoss(d.id); $("bBack").onclick=()=>{ S.dist=d.id; goTab("career"); };
    window.scrollTo(0,0);
  });
}

function buildShell(){
  document.title=UNIT.brand;

  document.querySelector(".tabs").innerHTML=["career","arcade","training","profile","save"].map((k,i)=>'<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(i===0)+'">'+esc(T.tabs[k])+'</button>').join("");
  $("backBtn").textContent="← "+T.back; $("foot").innerHTML=UNIT.footer;
  $("pvFlag").textContent=T.previewFlag; $("hudDaysL").textContent=T.daysShort; document.documentElement.lang=LANG.code;
}

$("home").addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t || t.getAttribute("aria-disabled")==="true" || t.disabled) return;
  if(t.hasAttribute("data-dist")){ S.dist=t.getAttribute("data-dist"); persist(); viewCareer(); return; }
  if(t.hasAttribute("data-mission")) return openMission(t.getAttribute("data-mission"));
  if(t.hasAttribute("data-boss")) return openBoss(t.getAttribute("data-boss"));
  if(t.hasAttribute("data-arcade")) return arcadeOpen(t.getAttribute("data-arcade"));
  if(t.hasAttribute("data-apool")){ S.apool=t.getAttribute("data-apool"); persist(); viewArcade(); return; }
  if(t.hasAttribute("data-set")){ S.set=t.getAttribute("data-set"); persist(); viewTraining(); return; }
  if(t.hasAttribute("data-train")){ S.set=t.getAttribute("data-train"); persist(); return trainOpen("flash"); }
  if(t.hasAttribute("data-train-act")) return trainOpen(t.getAttribute("data-train-act"));
  if(t.hasAttribute("data-skin")){ S.skin=t.getAttribute("data-skin"); applySkin(); persist(); viewSave(); return; }
  if(t.hasAttribute("data-item")) return itemInfo(t.getAttribute("data-item"));
  if(t.hasAttribute("data-tabgo")) return goTab(t.getAttribute("data-tabgo"));
  if(t.hasAttribute("data-look")){ const [k,v]=t.getAttribute("data-look").split(":"); G.look[k]=+v; persist(); viewProfile(); drawHUD(); return; }
});
document.querySelector(".tabs").addEventListener("click", e=>{ const b=e.target.closest("[data-tab]"); if(b) goTab(b.getAttribute("data-tab")); });
$("backBtn").addEventListener("click", ()=>{ cleanup(); (BACK||goHome)(); });
$("sndBtn").onclick=()=>{ S.sound=!S.sound; persist(); drawHUD(); if(S.sound) SFX.ok(); };
$("skinBtn").onclick=()=>{ const i=SKINS.findIndex(s=>s[0]===S.skin); S.skin=SKINS[(i+1)%SKINS.length][0]; applySkin(); persist(); toast("🎨",T.lookShort+" : "+SKINS.find(s=>s[0]===S.skin)[1],T.lookAgain); };
$("saveBtn").onclick=()=>goTab("save");

restore(); if(!SKINS.some(s=>s[0]===S.skin)) S.skin=SKINS[0][0]; applySkin(); S.seenDerived=derivedSet(); S.seenItems=allTiers(); goTab(["career","arcade","training","profile","save"].indexOf(S.tab)>=0?S.tab:"career");
