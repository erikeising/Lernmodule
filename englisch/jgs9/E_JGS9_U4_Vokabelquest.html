/* ===================== Type it with spaced queue ===================== */
function typeQueue(words, opt, done){
  const self={dir:opt.dir||"de2en", size:opt.size||12};
  function start(){ self.q=new Queue(words, opt.fixed? words.length : self.size); self.bounce=false; render(); }
  function render(){
    const q=self.q, it=q.cur();
    let h=opt.fixed ? '' : seg("tDir",[["de2en","German → English"],["en2de","English → German"],["mix","Mixed"]],self.dir)+seg("tSize",[["8","8 words"],["12","12"],["20","20"]],String(self.size));
    h+='<p class="why">'+(opt.why||'Like Part A of the test. Spelling counts in English. Each word needs two right answers; a hint means the word comes back once more.')+'</p>';
    h+=progress(q.mastered(),q.items.length,q.mastered()+" / "+q.items.length+" words learnt",q.turns+" answers")+q.dots();
    if(!it) return end();
    const w=it.w; const d=self.dir==="mix" ? (Math.random()<(opt.enShare||.5)?"de2en":"en2de") : self.dir;
    let hint=0, tries=0, closed=false, result="ko";
    h+='<div class="prompt"><span class="pl">'+(d==="de2en"?"German → write the English word":"English → write the German word")+'</span>'+(d==="de2en"?deWord(w):'<div class="word">'+esc(w.disp||w.en)+'</div>')+pills(w)+'</div>';
    h+='<form class="row" id="tForm" autocomplete="off"><input type="text" id="tIn" aria-label="Your answer" autocapitalize="none" spellcheck="false" placeholder="'+(d==="de2en"?"English word …":"deutsches Wort …")+'">'+
       '<button class="btn ghost" type="button" id="tHint">Hint</button><button class="btn" type="submit" id="tGo">Check</button></form><div id="tFb"></div><div id="tAns"></div>';
    V.innerHTML=h;
    onSeg("tDir",v=>{ self.dir=v; start(); }); onSeg("tSize",v=>{ self.size=+v; start(); });
    $("tHint").onclick=()=>{ hint++; const target=d==="de2en"? headword(w) : deMeanings(w)[1]||w.de;
      const shown = hint===1 ? target.charAt(0)+"…" : target.split("").map((c,i)=>i===0||c===" "||c==="-"?c:"_").join(" ");
      $("tFb").innerHTML=fb("mid","Hint: "+esc(shown), hint===1?"Press Hint again to see how long the word is.":""); $("tIn").focus(); };
    $("tForm").onsubmit=e=>{ e.preventDefault();
      if(closed){ q.grade(result); render(); return; }
      const inp=$("tIn").value; if(!inp.trim()) return;
      const res = d==="de2en" ? checkEN(inp,w) : checkDE(inp,w);
      if(res.r==="mid" && tries===0){ tries++; SFX.mid(); typedRun(false); $("tIn").className="mid-mark"; $("tFb").innerHTML=fb("mid",res.msg||"Almost! Check your spelling and try again."); $("tIn").select(); return; }
      closed=true; $("tIn").readOnly=true; $("tHint").disabled=true; $("tGo").textContent="Next →";
      if(res.r==="ok"){ $("tIn").className="ok-mark"; SFX.ok(); typedRun(!hint && !tries);
        $("tFb").innerHTML=fb("ok", hint?"Right – with a hint. This word comes back once more.":"Right!", res.note?esc(res.note):""); result=hint?"hint":"ok"; rec(w.en,!hint);
        award(hint?2:(opt.xp||5)); if(it.miss>0 && !hint) self.bounce=true; }
      else { $("tIn").className="ko-mark"; SFX.ko(); typedRun(false); result="ko"; rec(w.en,false);
        $("tFb").innerHTML=fb("ko","Not quite. The answer is below – this word comes back soon.")+(d==="en2de"?'<button type="button" class="linkish" id="tOwn">My German answer means the same → count it as right</button>':'');
        const own=$("tOwn"); if(own) own.onclick=()=>{ result="ok"; if(S.stats[w.en]) S.stats[w.en].k=Math.max(0,S.stats[w.en].k-1); $("tIn").className="ok-mark"; $("tFb").innerHTML=fb("ok","Counted as right."); award(opt.xp||5); focusSoon("tGo"); }; }
      $("tAns").innerHTML=answerBox(w); if(d==="de2en") say(speakable(w.en));
      focusSoon("tGo");
    };
    focusSoon("tIn");
  }
  function end(){
    const q=self.q, miss=q.items.filter(i=>i.miss>0).map(i=>i.w);
    if(self.bounce) earnBadge(1);
    if(done) return done({items:q.items, turns:q.turns, miss:miss});
    V.innerHTML='<div class="result"><div class="score">'+(q.items.length-miss.length)+' / '+q.items.length+'</div><p>words right the first time they came up. All '+q.items.length+' words learnt in '+q.turns+' answers.</p></div>'+trickyChips(miss)+
      '<div class="row"><button class="btn wide" id="again" type="button">New words</button><button class="btn ghost wide" id="toCtx" type="button">Use them in sentences →</button></div>';
    $("again").onclick=start; $("toCtx").onclick=()=>trainOpen("ctx");
  }
  start();
}

/* ===================== Words in context (test Part B) ===================== */
function ckeys(w){ return grps(w).concat(w.pos==="adj"?["ADJ"]:(w.pos==="adv"?["ADV"]:[])); }   /* never two of one group, max. one adjective/adverb per set */
function pickSet(pool, n, rot){
  const chosen=[], keys=new Set(), sents=new Set();
  const take=w=>{ const k=ckeys(w); if(k.some(x=>keys.has(x))||(w.sent&&sents.has(w.sent))||chosen.indexOf(w)>=0) return false; chosen.push(w); k.forEach(x=>keys.add(x)); if(w.sent) sents.add(w.sent); return true; };
  for(let i=0;i<rot.length && chosen.length<n;){ if(take(rot[i])) rot.splice(i,1); else i++; }
  if(chosen.length<n) shuffle(pool).forEach(w=>{ if(chosen.length<n) take(w); });
  const extra=shuffle(pool.concat(ALL.filter(w=>w.ex&&w.bl))).find(w=>chosen.indexOf(w)<0 && !ckeys(w).some(x=>keys.has(x)) && !(w.sent&&sents.has(w.sent)) && chosen.every(c=>headword(c)!==headword(w) && !sameFamily(c,w)));
  return {items:chosen, extra:extra};
}
function clozeOK(w){ return w.ex && w.bl && w.ex.indexOf(w.bl)>=0; }
/* one set of gaps; two checking rounds ("almost" answers can be corrected once) */
function ctxSet(items, extra, opt, done){
  const status=items.map(()=>null); let round=0;
  const box=items.concat(extra?[extra]:[]).map(headword).sort((a,b)=>a.localeCompare(b));
  let h=(opt.top||"")+'<p class="why">Like Part B of the test: complete the sentences'+(opt.mode==="letter"?'. The first letter is given.':' with words from the box. Use the correct form (claim → claimed). There is one word you don’t need.')+'</p>';
  if(opt.mode!=="letter") h+='<div class="box" aria-label="Word box">'+box.map(b=>'<span>'+esc(b)+'</span>').join("")+'</div>';
  h+='<form id="cForm" autocomplete="off"><div class="clist">'+items.map((w,i)=>'<div class="citem"><p>'+gapSentence(w,opt.mode==="letter")+'</p><input type="text" id="c'+i+'" aria-label="Gap '+(i+1)+'" autocapitalize="none" spellcheck="false"><div class="sol" id="cs'+i+'"></div></div>').join("")+'</div>'+
     '<div id="cFb"></div><div class="row"><button class="btn wide" type="submit" id="cGo">Check</button></div></form>';
  V.innerHTML=h; if(opt.bind) opt.bind();
  let finished=false;
  $("cForm").onsubmit=e=>{ e.preventDefault();
    if(finished){ done(status.filter(s=>s==="ok").length, items.length, items.filter((w,i)=>status[i]!=="ok")); return; }
    if(round===0 && items.some((w,i)=>!$("c"+i).value.trim())){ $("cFb").innerHTML=fb("mid","Fill in all the gaps first. Guess if you are not sure."); return; }
    items.forEach((w,i)=>{ if(status[i]==="ok"||status[i]==="ko") return;
      const inp=$("c"+i), g=gradeCtx(inp.value,w);
      if(g==="ok"){ status[i]="ok"; inp.className="ok-mark"; inp.readOnly=true; $("cs"+i).innerHTML=""; }
      else if((g==="form"||g==="spell") && round===0 && !opt.oneRound){ status[i]="mid"; inp.className="mid-mark";
        $("cs"+i).innerHTML=g==="form"?"Right word – now check the <b>form</b> (tense, -s, plural …).":"Almost – check the <b>spelling</b>."; }
      else { status[i]="ko"; inp.className="ko-mark"; inp.readOnly=true; $("cs"+i).innerHTML="Answer: <b>"+esc(w.bl)+"</b>"+(headword(w)!==w.bl?" ("+esc(headword(w))+")":""); }
    });
    round++;
    if(status.every(s=>s==="ok"||s==="ko")){
      finished=true; const r=status.filter(s=>s==="ok").length;
      items.forEach((w,i)=>rec(w.en,status[i]==="ok")); if(r) { SFX.ok(); award(r*(opt.xp||6)); } else SFX.ko();
      $("cFb").innerHTML=fb(r===items.length?"ok":(r>=Math.ceil(items.length*.6)?"mid":"ko"), r+" / "+items.length+" right.");
      $("cGo").textContent=opt.nextLabel||"Next →"; focusSoon("cGo");
    } else { SFX.mid(); $("cFb").innerHTML=fb("mid","Some answers are almost right. Correct them and check again."); $("cGo").textContent="Check again"; }
  };
  focusSoon("c0");
}

/* ===================== Practice test (= Rally) ===================== */
function practiceTest(words, opt, done){
  const ws=shuffle(words); const en2de=ws.slice(0,5), de2en=ws.slice(5,10);
  const pool=words.filter(clozeOK); const free=pool.filter(w=>en2de.indexOf(w)<0&&de2en.indexOf(w)<0);
  const s=pickSet(free.length>=6?free:pool,5,[]);
  const box=s.items.concat(s.extra?[s.extra]:[]).map(headword).sort((a,b)=>a.localeCompare(b));
  let h='<p class="why">'+(opt.why||'Like the vocabulary part of your test: 15 points, no hints, one try.')+'</p>';
  h+='<form id="mForm" autocomplete="off"><p class="sec">Part A · Vocabulary (10 points)</p><p class="why" style="margin-top:2px">Write the German word (1–5) and the English word (6–10).</p><div class="clist">';
  en2de.forEach((w,i)=>{ h+='<div class="citem"><p>'+esc(w.disp||w.en)+'</p><input type="text" id="ma'+i+'" aria-label="German word for '+esc(w.en)+'" autocapitalize="none" spellcheck="false"><div class="sol" id="msa'+i+'"></div></div>'; });
  de2en.forEach((w,i)=>{ h+='<div class="citem"><p lang="de">'+esc(w.de)+'</p><input type="text" id="mb'+i+'" aria-label="English word" autocapitalize="none" spellcheck="false"><div class="sol" id="msb'+i+'"></div></div>'; });
  h+='</div><p class="sec">Part B · Words in context (5 points)</p><p class="why" style="margin-top:2px">Complete the sentences with words from the box. Use the correct form. There is one word you don’t need.</p>';
  h+='<div class="box">'+box.map(b=>'<span>'+esc(b)+'</span>').join("")+'</div><div class="clist" style="counter-reset:c 10">';
  s.items.forEach((w,i)=>{ h+='<div class="citem"><p>'+gapSentence(w,false)+'</p><input type="text" id="mc'+i+'" aria-label="Gap '+(i+1)+'" autocapitalize="none" spellcheck="false"><div class="sol" id="msc'+i+'"></div></div>'; });
  h+='</div><div id="mRes"></div><div class="row"><button class="btn wide" type="submit" id="mGo">Hand in</button></div></form>';
  V.innerHTML=h; let graded=false, result=null;
  $("mForm").onsubmit=e=>{ e.preventDefault();
    if(graded){ done(result); return; }
    let pts=0; const miss=[];
    const mark=(id,sid,kind,sol)=>{ const el=$(id); el.readOnly=true; el.className=kind==="ok"?"ok-mark":(kind==="mid"?"mid-mark":"ko-mark"); $(sid).innerHTML=sol; };
    en2de.forEach((w,i)=>{ const ok=checkDE($("ma"+i).value,w).r==="ok"; if(ok) pts++; else miss.push(w); rec(w.en,ok); mark("ma"+i,"msa"+i,ok?"ok":"ko", ok?"":"Answer: <b>"+esc(w.de)+"</b>"); });
    de2en.forEach((w,i)=>{ const res=checkEN($("mb"+i).value,w), ok=res.r==="ok"; if(ok) pts++; else miss.push(w); rec(w.en,ok); mark("mb"+i,"msb"+i,ok?"ok":"ko", ok?"":(res.near?"Right meaning, but the test asks for the word from the list: ":"Answer: ")+"<b>"+esc(w.disp||w.en)+"</b>"); });
    s.items.forEach((w,i)=>{ const g=gradeCtx($("mc"+i).value,w); const ok=g==="ok", half=g==="form";
      pts+= ok?1:(half?.5:0); if(!ok) miss.push(w); rec(w.en,ok);
      mark("mc"+i,"msc"+i,ok?"ok":(half?"mid":"ko"), ok?"":(half?"½ point – right word, wrong form. Answer: <b>"+esc(w.bl)+"</b>":"Answer: <b>"+esc(w.bl)+"</b>")); });
    graded=true; result={pts:pts, miss:miss};
    award(Math.round(pts*8));
    const pct=Math.round(pts/15*100);
    $("mRes").innerHTML='<div class="result"><div class="score">'+String(pts).replace(".",",")+' / 15</div><p>'+pct+' %. '+(pct>=90?"Excellent – you are ready.":pct>=70?"Good. Practise the words below once more.":"Practise the words below in your projects and with “Type it”, then try again.")+'</p></div>'+trickyChips(miss);
    $("mGo").textContent=opt.nextLabel||"Continue →"; pct>=60?SFX.star():SFX.ko();
    $("mRes").scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});
  };
}

/* ===================== Project stages ===================== */
function stageMeet(m, done){
  const words=m.words; let q=shuffle(words).map(w=>({w:w,again:0})); let seen=0;
  function flash(){
    const it=q[0];
    if(!it) return check();
    const w=it.w;
    let h='<p class="why"><b>Part 1 · Meet the words.</b> Say or think the English word <b>before</b> you turn the card. Then: part 2 checks you.</p>'+progress(seen,words.length+q.filter(x=>x.again).length,"Card "+(seen+1),"");
    h+='<div class="prompt"><span class="pl">German</span>'+deWord(w)+pills(w)+'</div>';
    h+='<div id="fBack" hidden>'+answerBox(w)+'<div class="row"><button class="btn ghost wide" id="fNo" type="button">Not yet</button><button class="btn wide" id="fYes" type="button">I knew it</button></div></div>';
    h+='<div class="row" id="fTurnRow"><button class="btn wide" id="fTurn" type="button">Turn the card</button></div>';
    V.innerHTML=h;
    $("fTurn").onclick=()=>{ $("fBack").hidden=false; $("fTurnRow").hidden=true; say(speakable(w.en)); focusSoon("fYes"); };
    $("fYes").onclick=()=>{ q.shift(); seen++; rec(w.en,true); award(1); flash(); };
    $("fNo").onclick=()=>{ q.shift(); seen++; rec(w.en,false); if(it.again<1){ it.again++; q.splice(Math.min(q.length,3),0,it); } flash(); };
    focusSoon("fTurn");
  }
  function check(){
    const items=shuffle(words).map((w,i)=>i%2===0? itMCEN(w,m.d.words,2) : itMCDE(w,m.d.words,2));
    quiz({items:items, label:"Check", top:()=>'<p class="why"><b>Part 2 · Check.</b> Choose the right word. 80 % wins ★.</p>'}, st=>{
      const pass=st.score/items.length>=.8; done({pass:pass, score:st.score, total:items.length, wrong:st.wrong.map(i=>i.w)});
    });
  }
  flash();
}
function stageRecall(m, done){
  typeQueue(m.words, {fixed:true, dir:"mix", enShare:.67, xp:5, why:'Type every word until you know it twice. Mostly German → English, sometimes English → German. Hints are allowed – the word then comes back once more.'},
    r=>done({pass:true, score:r.items.length-r.miss.length, total:r.items.length, wrong:r.miss, turns:r.turns}));
}
function stageMaster(m, done){
  const items=shuffle(m.words).map(w=>itTypeEN(w,6));
  quiz({items:items, label:"Word", hints:false, top:()=>'<p class="why"><b>Master ★★★.</b> No hints. Part 1: German → English. Part 2: words in sentences. 80 % wins ★★★.</p>'}, st=>{
    const pool=m.words.filter(clozeOK);
    if(pool.length<3) return done({pass:st.score/items.length>=.8, score:st.score, total:items.length, wrong:st.wrong.map(i=>i.w)});
    const s=pickSet(pool, Math.min(5,pool.length), []);
    ctxSet(s.items, s.extra, {mode:"box", xp:6, nextLabel:"See result →", top:'<p class="why"><b>Part 2 · Words in context.</b></p>'}, (r,t,miss)=>{
      const score=st.score+r, total=items.length+t;
      done({pass:score/total>=.8, score:score, total:total, wrong:st.wrong.map(i=>i.w).concat(miss)});
    });
  });
}

function stageExpert(m, done){
  const items=shuffle(m.words).map((w,i)=> i%3===2 ? itTypeDE(w,8) : itTypeEN(w,8));
  quiz({items:items, label:"Word", hints:false, almost:false, top:()=>'<p class="why"><b>👑 Expert.</b> Both directions, no hints, no second try. Then sentences with only the first letter – no word box. 90 % wins the crown.</p>'}, st=>{
    const pool=m.words.filter(clozeOK);
    if(pool.length<3) return done({pass:st.score/items.length>=.9, score:st.score, total:items.length, wrong:st.wrong.map(i=>i.w)});
    const s=pickSet(pool, Math.min(5,pool.length), []);
    ctxSet(s.items, null, {mode:"letter", oneRound:true, xp:8, nextLabel:"See result →", top:'<p class="why"><b>Part 2 · Words in context – first letter only, one try.</b></p>'}, (r,t,miss)=>{
      const score=st.score+r, total=items.length+t;
      done({pass:score/total>=.9, score:score, total:total, wrong:st.wrong.map(i=>i.w).concat(miss)});
    });
  });
}

/* --- Word rain --- */
function gameRain(){
  const pool=arcadePool();
  let lives=3, level=1, cleared=0, drops=[], last=0, spawnAt=0, raf=0, over=false, paused=false, missed=[];
  V.innerHTML='<p class="why">Answer each email: type the English word – no Enter needed. An email that reaches the bottom piles up and costs a life.</p>'+
    '<div class="ahud"><span class="hearts" id="wrL"></span><span>Level <span class="big" id="wrLv">1</span></span><span>Cleared <span class="big" id="wrC">0</span></span><span style="color:var(--muted)">Best today: '+(S.best.rain||0)+'</span></div>'+
    '<form class="row" id="wrF" autocomplete="off"><input type="text" id="wrIn" aria-label="English word" autocapitalize="none" spellcheck="false" placeholder="Type here …"><button class="btn ghost" type="button" id="wrP">Pause</button></form><div class="ticker" id="wrT" aria-live="polite"></div>'+
    '<div class="rain" id="wrBox"><div class="ground"></div></div>';
  const box=$("wrBox");
  function hud(){ $("wrL").textContent="❤️".repeat(lives)+"🤍".repeat(3-lives); $("wrLv").textContent=level; $("wrC").textContent=cleared; }
  const speed=()=>(reduced?18:26)*(1+.16*(level-1));
  const gapMs=()=>Math.max(1100, 3000*Math.pow(.88,level-1));
  function spawn(){
    const onScreen=new Set(drops.map(d=>d.w));
    const cand=pool.filter(w=>!onScreen.has(w) && !drops.some(d=>sameFamily(d.w,w)));
    if(!cand.length) return; const w=pick(cand);
    const el=document.createElement("div"); el.className="drop mail"; el.lang="de"; el.innerHTML='<span class="from" aria-hidden="true">✉ New email</span>'+esc(shortDE(w)); box.appendChild(el);
    const maxX=Math.max(4, box.clientWidth-el.offsetWidth-6);
    drops.push({w:w, el:el, x:4+Math.random()*maxX, y:-el.offsetHeight});
  }
  function loop(ts){
    if(over) return;
    if(!last) last=ts; const dt=Math.min(.05,(ts-last)/1000); last=ts;
    if(!paused){
      if(ts>=spawnAt){ spawn(); spawnAt=ts+gapMs(); }
      const H=box.clientHeight-6;
      drops.slice().forEach(d=>{ d.y+=speed()*dt; d.el.style.transform="translate("+d.x+"px,"+d.y+"px)";
        if(d.y+d.el.offsetHeight>=H){ drops.splice(drops.indexOf(d),1); d.el.remove(); lives--; missed.push(d.w); rec(d.w.en,false); SFX.ko();
          $("wrT").innerHTML='Piled up: <b lang="de">'+esc(shortDE(d.w))+'</b> = <b>'+esc(d.w.disp||d.w.en)+'</b>'; hud(); if(lives<=0) end(); } });
    }
    raf=requestAnimationFrame(loop);
  }
  function tryClear(v, enter){
    const d=drops.find(d=>checkEN(v,d.w).r==="ok");
    if(d){ drops.splice(drops.indexOf(d),1); d.el.classList.add("hit"); setTimeout(()=>d.el.remove(),350); cleared++; SFX.ok(); rec(d.w.en,true); award(3);
      $("wrT").innerHTML='✓ <b>'+esc(d.w.disp||d.w.en)+'</b> – '+esc(d.w.de); $("wrIn").value="";
      if(cleared%6===0){ level++; toast("📥","Level "+level,"More emails arrive now."); if(level>=5) earnBadge(6); }
      hud(); return; }
    if(enter){ const nd=drops.find(d=>checkEN(v,d.w).r==="mid"); $("wrT").innerHTML = nd ? (checkEN(v,nd.w).msg||"Almost – check the spelling.") : "No falling word matches “"+esc(v)+"”."; if(nd) SFX.mid(); }
  }
  $("wrIn").addEventListener("input",e=>{ const v=e.target.value; if(v.trim().length>=2) tryClear(v,false); });
  $("wrF").onsubmit=e=>{ e.preventDefault(); const v=$("wrIn").value; if(v.trim()) tryClear(v,true); };
  $("wrP").onclick=()=>{ paused=!paused; $("wrP").textContent=paused?"Go on":"Pause"; if(!paused){ last=0; $("wrIn").focus(); } };
  const vis=()=>{ if(document.hidden){ paused=true; $("wrP").textContent="Go on"; } };
  document.addEventListener("visibilitychange",vis);
  CLEANUP=()=>{ over=true; cancelAnimationFrame(raf); document.removeEventListener("visibilitychange",vis); };
  function end(){ over=true; cancelAnimationFrame(raf); document.removeEventListener("visibilitychange",vis); CLEANUP=null;
    const nb=best("rain",cleared); endScreen(cleared+" words", "Level "+level+(nb&&cleared?" · new best today!":"")+".", missed, gameRain); }
  hud(); raf=requestAnimationFrame(loop); focusSoon("wrIn");
}

/* --- Spell builder --- */
function gameSpell(){
  const target=w=>headword(w).toLowerCase();
  const pool=arcadePool().filter(w=>{ const t=target(w); return t.length>=3 && t.length<=16 && /^[a-z' -]+$/.test(t); });
  const words=shuffle(pool).slice(0,10); let i=0, right=0, noHint=0, missed=[];
  function render(){
    const w=words[i]; if(!w) return end();
    const t=target(w); const chars=t.split(""); const fixed=chars.map(c=>/[a-z]/.test(c)?null:c);
    const letters=shuffle(chars.filter(c=>/[a-z]/.test(c)).map((c,k)=>({c:c,k:k})));
    const placed=[]; let hinted=false, closed=false;
    V.innerHTML=progress(i,words.length,"Word "+(i+1)+" / "+words.length,right+" built")+
      '<div class="prompt"><span class="pl">Build the English word</span>'+deWord(w)+pills(w)+'</div>'+
      '<div class="slots" id="sbS" aria-live="polite"></div><div class="tilesL" id="sbT"></div>'+
      '<div class="row"><button class="btn ghost" type="button" id="sbB">⌫ Back</button><button class="btn ghost" type="button" id="sbH">Hint</button><button class="btn ghost" type="button" id="sbX">Skip</button></div><div id="sbFb"></div><div id="sbA"></div>'+
      '<p class="why">Tip: you can also type the letters on your keyboard.</p>';
    function slots(){ let p=0; $("sbS").innerHTML=chars.map((c,k)=>{ if(fixed[k]!==null) return '<span class="slot sp">'+(c===" "?"":esc(c))+'</span>';
      const pl=placed[p++]; const cur=!pl && p-1===placed.length; return '<span class="slot'+(cur?" cur":"")+(pl&&pl.h?" hint":"")+'">'+(pl?esc(pl.c):"")+'</span>'; }).join(""); }
    function tiles(){ $("sbT").innerHTML=letters.map((l,k)=>'<button type="button" class="lt" data-k="'+k+'"'+(placed.some(p=>p.k===k)?" disabled":"")+'>'+esc(l.c)+'</button>').join(""); }
    const need=letters.length;
    function built(){ let p=0; return chars.map((c,k)=>fixed[k]!==null?c:(placed[p++]||{c:""}).c).join(""); }
    function place(k,h){ if(closed||placed.length>=need) return; placed.push({c:letters[k].c,k:k,h:!!h}); slots(); tiles(); if(placed.length===need) check(); }
    function check(){
      if(built()===t){ closed=true; right++; if(!hinted) noHint++; SFX.ok(); rec(w.en,!hinted); award(hinted?2:4); $("sbFb").innerHTML=fb("ok","Right!"); $("sbA").innerHTML=answerBox(w); say(speakable(w.en));
        setTimeout(()=>{ i++; render(); }, 1300); }
      else { SFX.ko(); $("sbS").classList.add("shake"); setTimeout(()=>$("sbS").classList.remove("shake"),330); $("sbFb").innerHTML=fb("ko","Not quite. Use ⌫ to change letters – or take a hint."); }
    }
    $("sbT").onclick=e=>{ const b=e.target.closest(".lt"); if(b&&!b.disabled) place(+b.getAttribute("data-k")); };
    $("sbB").onclick=()=>{ if(closed) return; placed.pop(); slots(); tiles(); $("sbFb").innerHTML=""; };
    $("sbH").onclick=()=>{ if(closed) return; hinted=true;
      const want=t.split("").filter(c=>/[a-z]/.test(c));
      let n=0; while(n<placed.length && placed[n].c===want[n]) n++;
      placed.length=n; const k=letters.findIndex((l,kk)=>l.c===want[n] && !placed.some(p=>p.k===kk));
      $("sbFb").innerHTML=""; if(k>=0) place(k,true); else { slots(); tiles(); } };
    $("sbX").onclick=()=>{ if(closed) return; closed=true; missed.push(w); rec(w.en,false); SFX.ko(); $("sbFb").innerHTML=fb("ko","The word: “"+esc(t)+"”"); $("sbA").innerHTML=answerBox(w)+'<div class="row"><button class="btn wide" id="sbN" type="button">Next →</button></div>'; $("sbN").onclick=()=>{ i++; render(); }; focusSoon("sbN"); };
    const key=e=>{ if(closed||e.target.tagName==="INPUT") return; const c=e.key.toLowerCase();
      if(e.key==="Backspace"){ e.preventDefault(); $("sbB").click(); return; }
      if(/^[a-z]$/.test(c)){ const k=letters.findIndex((l,kk)=>l.c===c && !placed.some(p=>p.k===kk)); if(k>=0) place(k); } };
    document.addEventListener("keydown",key); CLEANUP=()=>document.removeEventListener("keydown",key);
    const prev=render._k; if(prev) document.removeEventListener("keydown",prev); render._k=key;
    slots(); tiles();
  }
  function end(){ if(render._k) document.removeEventListener("keydown",render._k); CLEANUP=null; if(noHint>=10) earnBadge(8);
    best("spell",right); endScreen(right+" / "+words.length, noHint+" without hints.", missed, gameSpell); }
  if(words.length<4){ V.innerHTML=emptyMsg("Not enough words for this game. Choose another word set in the Arcade."); return; }
  render();
}

/* --- mixed item generator (Survival, Daily) --- */
function mixedItem(pool, rnd){
  rnd=rnd||Math.random;
  const w=pick(pool,rnd), x=rnd();
  const opp=OPP.find(o=>(o.en||o.w)===w.en), same=SAME.find(s=>s[0]===w.en), par=PARTNERS.filter(p=>p.en===w.en);
  if(x<.38) return itTypeEN(w,4);
  if(x<.52) return itMCDE(w,pool,2);
  if(x<.67 && clozeOK(w)) return itGap(w,5);
  if(x<.77 && opp) return itOpp(opp,false);
  if(x<.88 && same) return itExplain(same);
  if(x<.95 && par.length) return itPartner(pick(par,rnd),false);
  return itTypeEN(w,4);
}
function gameSurvive(){
  const pool=arcadePool();
  quiz({gen:()=>mixedItem(pool), lives:3, best:()=>S.best.survive||0, top:()=>'<p class="why">Every task type, mixed. A wrong answer costs a life; “Almost” gives you a second try.</p>'}, st=>{
    if(st.score>=20) earnBadge(7); storeTier("mug",st.score); const nb=best("survive",st.score);
    endScreen(st.score+" right", "Survival"+(nb&&st.score?" · new best today!":"")+".", st.wrong.map(i=>i.w).filter(Boolean), gameSurvive);
  });
}
function gameDaily(){
  const d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(), rnd=mulberry(fnv("daily|"+key));
  const items=[]; const used=new Set(); let guard=0;
  while(items.length<10 && guard++<200){ const it=mixedItem(ALL,rnd); if(it.w && used.has(it.w.en)) continue; if(it.w) used.add(it.w.en); items.push(it); }
  quiz({items:items, label:"Task", top:()=>'<p class="why">Today’s briefing – '+esc(d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}))+'. Your classmates get the same 10 tasks today: compare in class!</p>'}, st=>{
    const today=dayIdx(); let extra="";
    if(S.daily!==today){ S.daily=today; persist(); earnBadge(10); if(st.score>=7){ award(40); extra='<p class="why" style="text-align:center">+40 XP daily bonus (7 or more right).</p>'; } }
    endScreen(st.score+" / 10", "Daily briefing. A new one comes tomorrow.", st.wrong.map(i=>i.w).filter(Boolean), gameDaily, extra);
  });
}

function trainFlash(){
  const self=trainFlash; self.dir=self.dir||"de2en"; self.size=self.size||12;
  const q=new Queue(tWords(), self.size);
  function render(){
    const it=q.cur();
    let h=seg("fDir",[["de2en","German → English"],["en2de","English → German"]],self.dir)+seg("fSize",[["8","8 words"],["12","12"],["20","20"]],String(self.size));
    h+='<p class="why">Say or think the word <b>before</b> you turn the card. Each word needs two right answers. Words you don’t know come back sooner.</p>';

function makeBoards(words, size){
  const rest=shuffle(words), boards=[];
  while(rest.length){ const b=[];
    for(let i=0;i<rest.length && b.length<size;){ const w=rest[i]; if(b.some(x=>sameFamily(x,w))){ i++; continue; } b.push(w); rest.splice(i,1); }
    if(!b.length) b.push(rest.shift()); boards.push(b); }
  return boards;
}

function trainRound(kind){

    top=()=>seg("pMode",[["choose","Choose"],["type","Type"]],TR.partners)+'<p class="why">Words come in partners. Learn them together: <i>responsible for</i>, <i>cope with</i>, <i>a job application</i>.</p>';

      '<p class="why">'+({same:"Find the word for an explanation in simple English.",explain:"Pick the best explanation in English. You need this when you mediate and don’t know a word: explain it in other words.",opp:"Find the opposite. Many opposites are made with a prefix.",fam:"Make a new word from the same family. These word families are not in the word list – they help you understand new words."})[s]+'</p>';
    bind=()=>{ onSeg("wSub",v=>{ TR.web=v; trainRound("web"); }); onSeg("wMode",v=>{ TR.webMode=v; trainRound("web"); }); }; }

    if(kind==="web"){ if(TR.web==="explain" && st.score===items.length && items.length>=8) earnBadge(4);
      if(S.web.indexOf(TR.web)<0){ S.web.push(TR.web); persist(); } if(["same","explain","opp","fam"].every(x=>S.web.indexOf(x)>=0)) earnBadge(2); }

      '<div class="row"><button class="btn wide" id="again" type="button">New round</button></div>';

  });

function runStage(m, k){
  const names={1:"★ Meet",2:"★★ Recall",3:"★★★ Master",4:"👑 Expert"};
  openAct("Project "+m.label+" · "+names[k], m.d.name+" · "+m.title, ()=>openMission(m.id));
  const fn={1:stageMeet,2:stageRecall,3:stageMaster,4:stageExpert}[k];
  fn(m, r=>{
    let bonus=0; if(r.pass) bonus=setStars(m,k);
    const nextM=m.d.missions[m.d.missions.indexOf(m)+1];
    V.innerHTML='<div class="result"><div class="bigstars">'+(k===4?'<span class="crown'+(r.pass?" on":"")+'">👑</span>':starStr(r.pass?k:0,k))+'</div><div class="score">'+r.score+' / '+r.total+'</div><p>'+
      (r.pass ? (k===2?'All words learnt'+(r.turns?' in '+r.turns+' answers':'')+'. ':'Project part done. ')+(bonus?'+'+bonus+' XP bonus.':(S.preview?'(Preview – no XP.)':'You already had this level – the XP for your answers still count.')) : 'You need '+(k===4?"90":"80")+' % for this level. Practise the words below, then try again.')+'</p></div>'+
      trickyChips(r.wrong||[], "Practise these again")+
      '<div class="row">'+(r.pass&&k<4?'<button class="btn wide" id="rNext" type="button">Next: '+names[k+1]+' →</button>':'')+(!r.pass?'<button class="btn wide" id="rAgain" type="button">Try again</button>':'')+
      (r.pass&&k>=3&&nextM?'<button class="btn '+(k<4?"ghost ":"")+'wide" id="rNM" type="button">Next project: '+esc(nextM.label)+' →</button>':'')+
      (r.pass&&k>=3&&!nextM&&bossOpen(m.d)?'<button class="btn wide" id="rBoss" type="button">🤝 '+esc(m.d.name)+' interview →</button>':'')+
      '<button class="btn ghost wide" id="rBack" type="button">Project overview</button></div>'+codeMini();
    const b=(id,f)=>{ const el=$(id); if(el) el.onclick=f; };
    b("rNext",()=>runStage(m,k+1)); b("rAgain",()=>runStage(m,k)); b("rNM",()=>openMission(nextM.id)); b("rBoss",()=>openBoss(m.d.id)); b("rBack",()=>openMission(m.id));
    focusSoon($("rNext")?"rNext":($("rNM")?"rNM":($("rAgain")?"rAgain":"rBack")));
  });
}
function openBoss(did){
  const d=DISTRICTS.find(x=>x.id===did); if(!bossOpen(d)) return;
  openAct("🤝 "+d.name+" job interview", "Test format · 15 points", ()=>{ S.dist=d.id; goTab("career"); });
  V.innerHTML='<div class="prompt" style="text-align:left"><span class="pl">Job interview</span><div class="word" style="font-size:1.4rem">Show what you know.</div><p style="margin:.4em 0 0">Exactly like the vocabulary part of your test: 10 words and 5 gaps, no hints, one try. ★ from 60 % · ★★ from 80 % · ★★★ from 95 %. ★★★ upgrades your access to Epic.</p></div><div class="row"><button class="btn wide" id="bGo" type="button">Start the interview</button></div>';
  $("bGo").onclick=()=>practiceTest(d.words, {nextLabel:"See result →", why:"Job interview · "+d.name+". Work on your own, then hand in."}, r=>{
    const pct=r.pts/15; const k=pct>=.95?3:(pct>=.8?2:(pct>=.6?1:0)); const bonus=k?setBoss(d,k):0;
    V.innerHTML='<div class="result"><div class="bigstars">'+starStr(k)+'</div><div class="score">'+String(r.pts).replace(".",",")+' / 15</div><p>'+(k?(bonus?'You got the job! +'+bonus+' XP bonus.':'Interview passed again.'):'60 % passes the interview. Practise the words below, then try again.')+'</p></div>'+trickyChips(r.miss)+
      '<div class="row"><button class="btn wide" id="bAgain" type="button">New interview</button><button class="btn ghost wide" id="bBack" type="button">Career</button></div>'+codeMini();
    $("bAgain").onclick=()=>openBoss(d.id); $("bBack").onclick=()=>{ S.dist=d.id; goTab("career"); };
    window.scrollTo(0,0);
  });
}

/* ===================== events & init ===================== */
$("home").addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t || t.getAttribute("aria-disabled")==="true" || t.disabled) return;
  if(t.hasAttribute("data-dist")){ S.dist=t.getAttribute("data-dist"); persist(); viewCareer(); return; }
  if(t.hasAttribute("data-mission")) return openMission(t.getAttribute("data-mission"));
  if(t.hasAttribute("data-boss")) return openBoss(t.getAttribute("data-boss"));
  if(t.hasAttribute("data-arcade")) return arcadeOpen(t.getAttribute("data-arcade"));
  if(t.hasAttribute("data-apool")){ S.apool=t.getAttribute("data-apool"); persist(); viewArcade(); return; }
  if(t.hasAttribute("data-set")){ S.set=t.getAttribute("data-set"); persist(); viewTraining(); return; }
  if(t.hasAttribute("data-train")){ S.set=t.getAttribute("data-train"); persist(); return trainOpen("flash"); }
  if(t.hasAttribute("data-train-act")) return trainOpen(t.getAttribute("data-train-act"));
  if(t.hasAttribute("data-skin")){ S.skin=t.getAttribute("data-skin"); applySkin(); persist(); viewSave(); return; }
  if(t.hasAttribute("data-item")) return itemInfo(t.getAttribute("data-item"));
  if(t.hasAttribute("data-tabgo")) return goTab(t.getAttribute("data-tabgo"));
  if(t.hasAttribute("data-look")){ const [k,v]=t.getAttribute("data-look").split(":"); G.look[k]=+v; persist(); viewProfile(); drawHUD(); return; }
});
document.querySelector(".tabs").addEventListener("click", e=>{ const b=e.target.closest("[data-tab]"); if(b) goTab(b.getAttribute("data-tab")); });
$("backBtn").addEventListener("click", ()=>{ cleanup(); (BACK||goHome)(); });
$("sndBtn").onclick=()=>{ S.sound=!S.sound; persist(); drawHUD(); if(S.sound) SFX.ok(); };
$("skinBtn").onclick=()=>{ const i=SKINS.findIndex(s=>s[0]===S.skin); S.skin=SKINS[(i+1)%SKINS.length][0]; applySkin(); persist(); toast("🎨","Look: "+SKINS.find(s=>s[0]===S.skin)[1],"Press again for the next look."); };
$("saveBtn").onclick=()=>goTab("save");

restore(); if(!SKINS.some(s=>s[0]===S.skin)) S.skin="lab"; applySkin(); S.seenDerived=derivedSet(); S.seenItems=allTiers(); goTab(["career","arcade","training","profile","save"].indexOf(S.tab)>=0?S.tab:"career");

/* test hook */
window.__CQ={pickSet,clozeOK,sameFamily,MAIN,REVIEW,ALL,BY,PARTNERS,SAME,OPP,FAM,PICS,SYN,MISSIONS,DISTRICTS,ITEMS,G,S,accepts,checkEN,checkDE,deMeanings,enAnswers,headword,gradeCtx,ctxAnswers,encodeCode,decodeCode,PAYLOAD_BITS,CHK_BITS,CODE_BITS,mixedItem,mainUsed,goTab,openMission,runStage,openBoss,arcadeOpen,trainOpen,award,rankIdx,setStars,setBoss,allTiers,itemTier,afterChange,storeTier,avatarSVG};

})();
